# overlord intrusion probe settings (sourced by intrusion.sh). Installed as
# /usr/local/lib/overlord/probes/intrusion.conf.

# users allowed to hold connections to outside (non-LAN) addresses; same list
# as the collector's OUTBOUND_OK_USERS
OUTBOUND_OK_USERS="root sysjay sysai"
# remote ports of common mining pools: any connection to one is critical
POOL_PORTS="3333 4444 5555 7777 14444 45700"
# command-line fragments of known miners and proxies (case-insensitive, one per line)
MINER_PATTERNS="xmrig
minerd
stratum+tcp
--donate-level
myawesomeproxy"
# processes (comm names) allowed to use a lot of CPU
CPU_OK="ffmpeg"
CPU_HOG_PCT=80    # percent of one core, averaged since the last run
CPU_HOG_RUNS=3    # runs in a row before cpu_hog fires
# a running program whose file was deleted. Critical as planned; a package
# upgrade can also leave these until the service restarts, so this is the knob
# if that turns out noisy.
DELETED_EXE_SEVERITY=critical
